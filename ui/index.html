<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="find-job-token" content="__FIND_JOB_TOKEN__" />
    <title>find-job</title>
    <link rel="icon" href="/ui/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <defs>
              <linearGradient id="brand-g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="var(--accent)" />
                <stop offset="1" stop-color="var(--accent-2)" />
              </linearGradient>
            </defs>
            <rect x="3" y="9" width="26" height="18" rx="5" fill="none" stroke="url(#brand-g)" stroke-width="2.4" />
            <path d="M11 9V7a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v2" fill="none" stroke="url(#brand-g)" stroke-width="2.4" />
            <path d="M10 18l4 4 8-8" fill="none" stroke="url(#brand-g)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div>
            <strong>find-job</strong>
            <span id="candidate" class="muted"></span>
          </div>
        </div>
        <nav class="nav" aria-label="Sections">
          <button data-view="dashboard" class="active"><span class="i">◎</span>Tableau de bord</button>
          <button data-view="applications"><span class="i">▤</span>Candidatures<span id="nav-count" class="count"></span></button>
          <button data-view="week"><span class="i">◫</span>Semaine<span id="nav-score" class="count"></span></button>
        </nav>
        <div class="sidebar-foot">
          <div class="live"><span class="live-dot" id="live-dot"></span><span id="live-text">Connexion…</span></div>
          <div id="workspace" class="muted mono small"></div>
          <button id="theme" class="ghost small" title="Changer de thème">◐ Thème</button>
        </div>
      </aside>
      <main id="main" tabindex="-1">
        <div class="loading"><span class="spinner"></span>Lecture de la mémoire…</div>
      </main>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <script type="module" src="/ui/app.js"></script>
  </body>
</html>
